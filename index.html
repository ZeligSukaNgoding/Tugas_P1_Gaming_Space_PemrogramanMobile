<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galaxy Shooter</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="430" height="760"></canvas>
      <div id="hud">
        <span>SKOR: <b id="score">0</b></span
        ><span>❤ <b id="lives">3</b></span>
      </div>
      <button id="pause">Ⅱ</button>
      <div id="overlay">
        <div class="panel">
          <h1 id="title">GALAXY SHOOTER</h1>
          <p id="msg">
            Hancurkan armada alien dan dapatkan point.
          </p>
          <button class="play" id="start">MULAI GAME</button>
        </div>
      </div>
      <div id="touch">
        <button class="touchbtn" id="left">‹</button>
        <button class="touchbtn" id="right">›</button>
        <button class="touchbtn" id="fire">●</button>
      </div>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
